databases:
  - name: vecta-db
    plan: free
    databaseName: vecta
    user: vecta

services:
  - type: web
    name: vecta-demo
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: vecta-demo.onrender.com
      - key: SITE_URL
        value: https://vecta-demo.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vecta-db
          property: connectionString
      - key: ALLOW_SELF_REGISTRATION
        value: "1"
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
      - key: NUM_PROXIES
        value: "1"
      - key: TOKEN_TTL_DAYS
        value: "30"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
