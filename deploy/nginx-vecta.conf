# /etc/nginx/sites-available/vecta   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx, certbot --nginx -d YOUR.DOMAIN)
server {
    listen 80;
    server_name leave.university.edu.ng;
    client_max_body_size 6m;            # leave attachments are limited to 5 MB

    location / {
        proxy_pass http://unix:/run/vecta/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
